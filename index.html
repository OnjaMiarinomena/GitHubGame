<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="parent">

        <div class="sidebar">
            <div class="logo">
                <h2>GameRoom</h2>
                <span>Manager</span>
            </div>
            <ul class="menu">
                <li>
                    <a href="#"> <i class="fa-solid fa-house"></i> Tableau de bord</a>
                </li>
                <li>
                    <a href="#"> <i class="fa-solid fa-clock"></i> Sessions en cours</a>
                </li>
                <li>
                    <a href="#"> <i class="fa-solid fa-gamepad"></i> Machines</a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-users"></i>Clients</a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-calendar"></i>Réservation</a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-wallet"></i>Paiement</a>
                </li>
                <li>
                    <a href="#"> <i class="fa-solid fa-tags"></i>Tarifs</a>
                </li>
                <li>    
                    <a href="#"><i class="fa-solid fa-chart-line"></i>Rapports</a>
                </li>
                <li>
                    <a href="#"> <i class="fa-solid fa-envelope"></i>Message</a>
                </li>
                <li>
                    <a href="#"><i class=" fa-solid fa-gear"></i>Parametres</a>
                </li>
            </ul>
            <div class="logout">
                <a href="#">Déconnexion</a>
            </div>
        </div>
        <div class="topbar">
            <div>
                <h2>Bonjour Gerant !</h2>
                <p class="Bonjour-gerant">Voici un aperçu de votre interface de aujourd'hui.</p>
            </div>

            <div class="deconnect">
                <p><i class="fa-solid fa-bell"></i> </p>
                <p class="ending-day">Fin de la journée    <i class="fa-solid fa-sign-out-alt"></i> </p>
            </div>
        </div>

    </div>

    
</body>
</html>
